services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: agentic-ai-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - ./data:/data
      - ./vector_db:/vector_db

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: agentic-ai-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: >
      npm run dev
      -- --host 0.0.0.0

    depends_on:
      - backend

    restart: unless-stopped